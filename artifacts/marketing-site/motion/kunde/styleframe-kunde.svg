<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="ONRODA Stilframe Kunde - Buchen, Verfolgen, Ankommen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mapGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d5001c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d5001c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redBtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="100%" stop-color="#d5001c"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Hintergrund futuristisch -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="540" cy="620" r="420" fill="url(#mapGlow)"/>
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <path d="M0 480 H1080 M0 720 H1080 M0 960 H1080 M0 1200 H1080"/>
    <path d="M180 0 V1920 M360 0 V1920 M540 0 V1920 M720 0 V1920 M900 0 V1920"/>
  </g>

  <!-- Phone frame -->
  <rect x="190" y="220" width="700" height="1480" rx="72" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="220" y="280" width="640" height="1360" rx="52" fill="#0b1220"/>

  <!-- Status bar -->
  <text x="260" y="340" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600">9:41</text>
  <rect x="430" y="312" width="220" height="44" rx="22" fill="#020617"/>

  <!-- Logo (Marketing-Standard) -->
  <image href="/onroda-logo-transparent.png" x="250" y="360" width="200" height="76" preserveAspectRatio="xMidYMid meet"/>
  <text x="260" y="448" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="22">Deine Fahrt. Live.</text>

  <!-- Map panel (anime flat + glow) -->
  <rect x="250" y="480" width="580" height="620" rx="36" fill="#111827" stroke="#1e293b" stroke-width="2"/>
  <path d="M280 980 Q420 720 540 780 T820 560" fill="none" stroke="#d5001c" stroke-width="10" stroke-linecap="round" opacity="0.85" filter="url(#softGlow)"/>
  <circle cx="820" cy="560" r="22" fill="#d5001c" filter="url(#softGlow)"/>
  <circle cx="820" cy="560" r="44" fill="#d5001c" opacity="0.25"/>
  <circle cx="380" cy="900" r="16" fill="#38bdf8"/>
  <circle cx="380" cy="900" r="32" fill="#38bdf8" opacity="0.2"/>
  <!-- Driver approaching -->
  <circle cx="620" cy="700" r="14" fill="#22c55e"/>
  <circle cx="620" cy="700" r="30" fill="#22c55e" opacity="0.25"/>
  <text x="650" y="708" fill="#86efac" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600">Fahrer 3 Min.</text>

  <!-- Ride card -->
  <g filter="url(#cardShadow)">
    <rect x="250" y="1140" width="580" height="320" rx="32" fill="#ffffff"/>
  </g>
  <text x="290" y="1200" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600">Aktuelle Fahrt</text>
  <rect x="680" y="1172" width="120" height="36" rx="18" fill="#fef2f2"/>
  <text x="702" y="1198" fill="#d5001c" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Live</text>
  <text x="290" y="1270" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800">Unterwegs</text>
  <text x="290" y="1320" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="24">Flughafen Stuttgart &#183; ETA 8 Min.</text>
  <rect x="290" y="1360" width="500" height="64" rx="18" fill="url(#redBtn)"/>
  <text x="430" y="1404" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700">Live verfolgen</text>

  <!-- Tagline (Stilframe) -->
  <text x="540" y="1680" fill="#fff" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700">Buchen. Verfolgen. Ankommen.</text>
  <text x="540" y="1740" fill="#94a3b8" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24">Stilframe &#183; Kunde &#183; Motion / Anime UI</text>
  <rect x="340" y="1780" width="400" height="6" rx="3" fill="#d5001c" opacity="0.8"/>
</svg>
